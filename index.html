<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habesha Bingo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding-bottom: 75px; -webkit-user-select: none; user-select: none; }

    /* Top Stats Bar */
    .top-bar { 
      background: #1e293b; 
      padding: 10px 8px; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      border-bottom: 2px solid #eab308; 
      display: none; 
    }
    .stat-row { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: space-around; 
      gap: 6px; 
      align-items: center; 
    }
    .stat-box { 
      background: #0f172a; 
      padding: 5px 8px; 
      border-radius: 6px; 
      border: 1px solid #334155; 
      font-size: 11px; 
      color: #94a3b8; 
    }
    .stat-box strong { color: #38bdf8; font-size: 12px; }
    .timer-box { color: #ef4444; font-weight: bold; border-color: #ef4444; }
    .timer-box strong { color: #ef4444; }

    /* Views */
    .view { display: none; padding: 14px; }
    .view.active { display: block !important; }

    /* SCREEN 1: WELCOME */
    .welcome-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 85vh; 
      text-align: center; 
      gap: 20px; 
    }
    .welcome-title { font-size: 26px; font-weight: 900; color: #eab308; }
    .welcome-quote { font-size: 18px; font-weight: bold; color: #38bdf8; font-style: italic; margin-top: -6px; }
    .stake-btn { 
      width: 100%; 
      max-width: 300px; 
      padding: 16px; 
      background: #1e293b; 
      border: 2px solid #eab308; 
      border-radius: 12px; 
      color: #fff; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-bottom: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .stake-btn:active { background: #eab308; color: #000; }

    /* SCREEN 2: CARTELA SELECTION */
    .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge { background: #eab308; color: #000; font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 12px; }
    
    /* የሚሰራው Refresh ቁልፍ */
    .refresh-btn { 
      background: #334155; 
      color: #38bdf8; 
      border: 1px solid #475569; 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 12px; 
      cursor: pointer; 
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .refresh-btn:active { transform: scale(0.95); background: #475569; }

    /* መጠናቸው አነስ የተደረጉ 1 - 600 ካርቴላዎች (8 Columns) */
    .cartela-grid { 
      display: grid; 
      grid-template-columns: repeat(8, 1fr); /* 8 አምድ ሆኖ ብዙ ቁጥር ይይዛል */
      gap: 4px; 
      max-height: 320px; 
      overflow-y: auto; 
      background: #1e293b; 
      padding: 8px; 
      border-radius: 8px; 
      border: 1px solid #334155; 
      margin-bottom: 12px; 
    }
    .cartela-btn { 
      background: #334155; 
      color: #cbd5e1; 
      border: 1px solid #475569; 
      padding: 6px 0; /* መጠኑ አነስተኛ ሆኗል */
      border-radius: 4px; 
      font-weight: bold; 
      font-size: 11px; /* ጽሁፉ አነስተኛ ሆኗል */
      cursor: pointer; 
      text-align: center;
    }
    .cartela-btn:active { transform: scale(0.95); }
    .cartela-btn.selected { 
      background: #10b981 !important; 
      border-color: #34d399 !important; 
      color: #ffffff !important; 
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); 
    }

    /* 5x5 Cartela Card */
    .bingo-card-wrapper { background: #1e293b; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid #475569; }
	.cartela-header { font-weight: bold; color: #38bdf8; margin-bottom: 6px; text-align: center; font-size: 12px; }
    .cartela-5x5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .cell { background: #0f172a; padding: 8px 0; text-align: center; border-radius: 4px; font-weight: bold; font-size: 13px; border: 1px solid #334155; }
    .cell.free { background: #eab308; color: #000; }

    /* ቀለማት */
    .cell.marked-B { background: #3b82f6 !important; color: #fff; }
    .cell.marked-I { background: #eab308 !important; color: #000; }
    .cell.marked-N { background: #a855f7 !important; color: #fff; }
    .cell.marked-G { background: #22c55e !important; color: #fff; }
    .cell.marked-O { background: #ef4444 !important; color: #fff; }

    /* SCREEN 3: GAMEPLAY */
    .game-caller-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #1e293b; padding: 10px 14px; border-radius: 8px; }
    .caller-ball { font-size: 26px; font-weight: 900; color: #38bdf8; }

    /* Master Board 1-75 */
    .bingo-board { display: flex; gap: 3px; margin-bottom: 15px; }
    .board-col { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .col-title { background: #4f46e5; text-align: center; padding: 3px 0; font-weight: bold; border-radius: 3px; font-size: 10px; }
    .num-pill { background: #1e293b; text-align: center; padding: 2px 0; border-radius: 3px; font-size: 10px; color: #94a3b8; }
    .num-pill.called { background: #10b981; color: #fff; font-weight: bold; }

    /* Winner Popup (ለ 4 ሰከንድ) */
    .winner-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.94); display: flex; justify-content: center; align-items: center; z-index: 100000; }
    .winner-card { background: #1e293b; border: 2px solid #eab308; border-radius: 14px; padding: 24px; text-align: center; width: 85%; max-width: 320px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: none; background: #0f172a; border-top: 2px solid #334155; height: 55px; z-index: 9999; }
    .nav-item { flex: 1; background: transparent; border: none; color: #94a3b8; font-size: 13px; font-weight: bold; cursor: pointer; }
    .nav-item.active { color: #eab308; }
  </style>
</head>
<body>

  <!-- Top Stats Bar -->
  <header class="top-bar" id="app-top-bar">
    <div id="lobby-stats" class="stat-row">
      <div class="stat-box">Main: <strong>0.00</strong> ETB</div>
      <div class="stat-box">Play: <strong>10.00</strong> ETB</div>
      <div class="stat-box timer-box">⏱ <strong id="countdown">49</strong>s</div>
    </div>
    <div id="gameplay-stats" class="stat-row" style="display: none;">
      <div class="stat-box">Game: <strong id="top-game-id">#0001</strong></div>
      <div class="stat-box">Players: <strong id="top-players">0</strong></div>
      <div class="stat-box">Bet: <strong id="top-bet">10</strong> ETB</div>
      <div class="stat-box">ደራሽ: <strong id="top-derash">0</strong> ETB</div>
      <div class="stat-box">Called: <strong id="top-called">0</strong>/75</div>
    </div>
  </header>

  <!-- SCREEN 1: WELCOME -->
  <main id="welcome-view" class="view active">
    <div class="welcome-container">
      <div>
        <h1 class="welcome-title">Welcome to Habesha Bingo</h1>
        <p class="welcome-quote">"ከመልክ ዕድል ያምራል"</p>
        <p style="color: #94a3b8; margin-top: 4px; font-size: 13px;">Choose your stake to start game</p>
      </div>

      <div style="width: 100%; max-width: 300px;">
        <button type="button" class="stake-btn" onclick="goToLobby(10, 1)">Play 10 Birr (1 ካርቴላ)</button>
        <button type="button" class="stake-btn" onclick="goToLobby(20, 2)">Play 20 Birr (እስከ 2 ካርቴላ)</button>
      </div>
    </div>
  </main>

  <!-- SCREEN 2: CARTELA SELECTION -->
  <main id="lobby-view" class="view">
    <div class="section-title">
      <div>
        <h3>ካርቴላ ይምረጡ</h3>
        <small style="color: #38bdf8;" id="stake-info">Play: 10 Birr</small>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button type="button" class="refresh-btn" onclick="executeRefresh()">🔄 Refresh</button>
        <span class="badge"><span id="selected-count">0</span>/<span id="max-count">1</span></span>
      </div>
    </div>

    <!-- 1 - 600 ሳጥን (በ 8 አምድ የተደረደሩ አነስተኛ ቁልፎች) -->
    <div class="cartela-grid" id="cartela-container"></div>
    <div id="active-cards-container"></div>
  </main>

  <!-- SCREEN 3: GAMEPLAY -->
  <main id="game-view" class="view">
    <div class="game-caller-bar">
      <div>
        <small style="color: #94a3b8; font-size: 11px;">የወጣው ቁጥር</small>
        <div class="caller-ball" id="current-call">--</div>
      </div>
      <div><span class="badge" style="background: #ef4444; color: #fff;">LIVE</span></div>
    </div>

    <div class="bingo-board">
      <div class="board-col" id="col-B"><div class="col-title">B</div></div>
      <div class="board-col" id="col-I"><div class="col-title">I</div></div>
      <div class="board-col" id="col-N"><div class="col-title">N</div></div>
      <div class="board-col" id="col-G"><div class="col-title">G</div></div>
      <div class="board-col" id="col-O"><div class="col-title">O</div></div>
    </div>

    <div id="in-game-cards"></div>
  </main>

  <nav class="bottom-nav" id="app-bottom-nav">
    <button class="nav-item active">🎮 Game</button>
  </nav>

  <script>
    var currentStake = 10;
    var maxCartelas = 1;
    var selectedCartelas = [];
    var generatedCards = {};
    var isPlaying = false;
    var gameInterval = null;
    var calledBalls = [];
    var calledSet = new Set();
    var CYCLE = 50; // 50 ሰከንድ ማዕከላዊ ዑደት

    function goToLobby(stake, max) {
      currentStake = stake;
      maxCartelas = max;
      document.getElementById('top-bet').innerText = currentStake;
      document.getElementById('max-count').innerText = maxCartelas;
      document.getElementById('stake-info').innerText = "Play: " + currentStake + " Birr";

      document.getElementById('app-top-bar').style.display = 'block';
      document.getElementById('app-bottom-nav').style.display = 'flex';

      document.getElementById('welcome-view').classList.remove('active');
      document.getElementById('lobby-view').classList.add('active');

      selectedCartelas = [];
      generatedCards = {};
      document.querySelectorAll('.cartela-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('selected-count').innerText = 0;
      document.getElementById('active-cards-container').innerHTML = '';
      calcDerash();
    }

    function calcDerash() {
      var mult = (currentStake === 10) ? 8 : 16;
      document.getElementById('top-derash').innerText = selectedCartelas.length * mult;
      document.getElementById('top-players').innerText = selectedCartelas.length;
    }

    // 1 - 600 አነስተኛ አዝራሮችን መፍጠር
    var cBox = document.getElementById('cartela-container');
    for (var i = 1; i <= 600; i++) {
      (function(n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cartela-btn';
        b.id = 'cbtn-' + n;
        b.innerText = n;
        b.onclick = function() { pickCartela(n, b); };
        cBox.appendChild(b);
      })(i);
    }

    // Auto-replace የሚሰራው ካርቴላ መምረጫ
    function pickCartela(id, btn) {
      if (isPlaying) return;
      var idx = selectedCartelas.indexOf(id);

      if (idx > -1) {
        selectedCartelas.splice(idx, 1);
        btn.classList.remove('selected');
        delete generatedCards[id];
      } else {
        if (selectedCartelas.length >= maxCartelas) {
		 var old = selectedCartelas.shift();
          var oldB = document.getElementById('cbtn-' + old);
          if (oldB) oldB.classList.remove('selected');
          delete generatedCards[old];
        }
        selectedCartelas.push(id);
        btn.classList.add('selected');
        generatedCards[id] = makeMatrix();
      }
      document.getElementById('selected-count').innerText = selectedCartelas.length;
      calcDerash();
      renderCards();
    }

    // Refresh ቁልፉ ሲነካ የሚሰራ
    function executeRefresh() {
      if (isPlaying) return;
      if (selectedCartelas.length === 0) {
        alert("እባክዎ መጀመሪያ ካርቴላ ይምረጡ!");
        return;
      }
      // የተመረጡትን ካርቴላዎች ቁጥሮች በሙሉ በአዲስ ይቀይራል
      for (var i = 0; i < selectedCartelas.length; i++) {
        var cid = selectedCartelas[i];
        generatedCards[cid] = makeMatrix();
      }
      renderCards();
    }

    function makeMatrix() {
      var col = (min, max) => {
        var s = [];
        while(s.length < 5) {
          var r = Math.floor(Math.random() * (max - min + 1)) + min;
          if (s.indexOf(r) === -1) s.push(r);
        }
        return s;
      };
      return { B: col(1,15), I: col(16,30), N: col(31,45), G: col(46,60), O: col(61,75) };
    }

    function renderCards() {
      var cont = document.getElementById('active-cards-container');
      cont.innerHTML = '';
      selectedCartelas.forEach(id => {
        var m = generatedCards[id];
        var h = '<div class="bingo-card-wrapper"><div class="cartela-header">ካርቴላ #' + id + '</div><div class="cartela-5x5">';
        var cols = ['B','I','N','G','O'];
        for (var r = 0; r < 5; r++) {
          for (var c = 0; c < 5; c++) {
            if (r === 2 && c === 2) {
              h += '<div class="cell free">FREE</div>';
            } else {
              var v = m[cols[c]][r];
              h += '<div class="cell" id="card-' + id + '-' + v + '">' + v + '</div>';
            }
          }
        }
        h += '</div></div>';
        cont.innerHTML += h;
      });
    }

    // 1-75 Master Board
    var ranges = { B:[1,15], I:[16,30], N:[31,45], G:[46,60], O:[61,75] };
    for (var k in ranges) {
      var colEl = document.getElementById('col-' + k);
      for (var n = ranges[k][0]; n <= ranges[k][1]; n++) {
        var p = document.createElement('div');
        p.className = 'num-pill';
        p.id = 'pill-' + n;
        p.innerText = n;
        colEl.appendChild(p);
      }
    }

    // ማዕከላዊ የጊዜ ቆጣሪ (Global Cycle)
    setInterval(function() {
      var now = Math.floor(Date.now() / 1000);
      var rem = (CYCLE - 1) - (now % CYCLE);
      document.getElementById('countdown').innerText = rem;

      if (rem === 0 && !isPlaying) {
        var lobbyActive = document.getElementById('lobby-view').classList.contains('active');
        if (lobbyActive || selectedCartelas.length > 0) {
          startGame();
        }
      }
    }, 1000);

    function startGame() {
      isPlaying = true;
      document.getElementById('lobby-stats').style.display = 'none';
      document.getElementById('gameplay-stats').style.display = 'flex';
      document.getElementById('lobby-view').classList.remove('active');
      document.getElementById('game-view').classList.add('active');

      document.getElementById('in-game-cards').innerHTML = document.getElementById('active-cards-container').innerHTML;

      calledBalls = [];
      calledSet.clear();
      var deck = [];
      for (var i = 1; i <= 75; i++) deck.push(i);
      deck.sort(() => 0.5 - Math.random());

      gameInterval = setInterval(function() {
        if (deck.length === 0 || calledBalls.length >= 75) {
          endGame("Draw!");
          return;
        }

        var ball = deck.pop();
        calledBalls.push(ball);
        calledSet.add(ball);

        var letter = ball <= 15 ? 'B' : ball <= 30 ? 'I' : ball <= 45 ? 'N' : ball <= 60 ? 'G' : 'O';
        document.getElementById('current-call').innerText = letter + '-' + ball;
        document.getElementById('top-called').innerText = calledBalls.length;
		var pill = document.getElementById('pill-' + ball);
        if (pill) pill.classList.add('called');

        selectedCartelas.forEach(cid => {
          var cell = document.getElementById('card-' + cid + '-' + ball);
          if (cell) cell.classList.add('marked-' + letter);
        });

        checkWin();
      }, 3000); // በየ 3 ሰከንዱ
    }

    // ማሸነፍ ማረጋገጫ (በ 4ቱ መስመሮች)
    function checkWin() {
      var cols = ['B','I','N','G','O'];
      for (var k = 0; k < selectedCartelas.length; k++) {
        var cid = selectedCartelas[k];
        var mat = generatedCards[cid];
        if (!mat) continue;

        var grid = Array(5).fill().map(() => Array(5).fill(false));
        for (var r = 0; r < 5; r++) {
          for (var c = 0; c < 5; c++) {
            if (r === 2 && c === 2) grid[r][c] = true;
            else grid[r][c] = calledSet.has(mat[cols[c]][r]);
          }
        }

        // 1. Horizontal
        for (var r = 0; r < 5; r++) {
          if (grid[r].every(Boolean)) { win(cid, "በረድፍ " + (r + 1)); return; }
        }
        // 2. Vertical
        for (var c = 0; c < 5; c++) {
          if (grid.map(row => row[c]).every(Boolean)) { win(cid, "በአምድ " + cols[c]); return; }
        }
        // 3. Diagonal TL-BR
        if ([0,1,2,3,4].every(i => grid[i][i])) { win(cid, "በሰያፍ (TL-BR)"); return; }
        // 4. Diagonal TR-BL
        if ([0,1,2,3,4].every(i => grid[i][4-i])) { win(cid, "በሰያፍ (TR-BL)"); return; }
      }
    }

    function win(cid, pattern) {
      clearInterval(gameInterval);
      var popup = 
        <div id="win-modal" class="winner-modal">
          <div class="winner-card">
            <h2 style="color: #eab308; margin-bottom: 8px;">🎉 እንኳን ደስ አለህ!</h2>
            <p style="font-size: 15px; margin-bottom: 6px; color: #fff;">አሸናፊ፡ <b>@Player</b></p>
            <p style="color: #38bdf8; font-size: 14px;">ያሸነፈበት ካርቴላ፡ <b>#${cid}</b> (${pattern})</p>
          </div>
        </div>
      ;
      document.body.insertAdjacentHTML('beforeend', popup);

      setTimeout(function() {
        var m = document.getElementById('win-modal');
        if (m) m.remove();
        resetToLobby();
      }, 4000); // ለ 4 ሰከንድ ቆይቶ ይመለሳል
    }

    function resetToLobby() {
      isPlaying = false;
      calledBalls = [];
      calledSet.clear();

      document.getElementById('lobby-stats').style.display = 'flex';
      document.getElementById('gameplay-stats').style.display = 'none';

      document.getElementById('game-view').classList.remove('active');
      document.getElementById('lobby-view').classList.add('active');

      document.getElementById('in-game-cards').innerHTML = '';
      document.querySelectorAll('.num-pill').forEach(p => p.classList.remove('called'));
      document.getElementById('current-call').innerText = '--';
      document.getElementById('top-called').innerText = '0';

      executeRefresh();
      calcDerash();
    }
  </script>
</body>
</html>
